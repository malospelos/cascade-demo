<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07516d"><title>CASCADE HUNT v16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063f5a;touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#063f5a}</style></head><body><iframe id="game" src="play-v15.html?v16=1" allow="autoplay"></iframe><script>
const frame=document.getElementById('game');
function enhance(){let w,d;try{w=frame.contentWindow;d=frame.contentDocument;if(!d||!d.querySelector('.rightRail')||!d.querySelector('#shop'))return false}catch(e){return false}if(d.getElementById('bombardBtn'))return true;
const css=d.createElement('style');css.textContent=`.rightRail{gap:7px!important}.hex{height:58px!important;min-height:0!important}.bombardBtn{background:linear-gradient(145deg,#e46e47,#a73734 60%,#762837)!important}.arsenalTitle{font-size:11px;font-weight:1000;letter-spacing:.08em;color:#ffe48b;margin:12px 0 6px}.powerShop{display:grid;grid-template-columns:1fr 1fr;gap:7px}.powerBuy{border:1px solid #ffffff20;border-radius:12px;background:#ffffff0c;padding:9px;text-align:center}.powerBuy .pi{font-size:27px}.powerBuy b{display:block;font-size:11px;margin:3px 0}.powerBuy small{display:block;color:#b8cbd6;font-size:8px;line-height:1.25;min-height:31px}.powerBuy button{width:100%;border:0;border-radius:9px;padding:8px 4px;margin-top:6px;background:#ffd75b;color:#17343d;font-size:10px;font-weight:1000}.powerBuy button:disabled{opacity:.45}.shopBalance{text-align:center;background:#062f46;border:1px solid #ffffff1d;border-radius:10px;padding:7px;font-size:12px;margin-bottom:8px}.bombFlash{position:fixed;z-index:9999;pointer-events:none;font-size:38px;transform:translate(-50%,-50%);animation:bombPop .55s ease-out forwards}@keyframes bombPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-90%) scale(.85)}}@media(max-height:700px){.hex{height:47px!important}.hex .ico{line-height:25px!important;font-size:19px!important}.rightRail{gap:5px!important}}`;d.head.appendChild(css);
let bombard=0;try{bombard=+localStorage.getItem('cascadeHuntV16Bombard')||0}catch(e){}function saveBomb(){try{localStorage.setItem('cascadeHuntV16Bombard',String(bombard))}catch(e){}}function medalBalance(){return typeof w.coins==='number'?w.coins:0}function spend(cost){if(medalBalance()<cost){w.showFloat('🏅 FALTAN MEDALLAS');return false}w.coins-=cost;return true}
const rail=d.querySelector('.rightRail'),btn=d.createElement('button');btn.id='bombardBtn';btn.className='hex bombardBtn';btn.innerHTML='<span class="ico">🚁</span><span class="name">BOMBARDEO</span><span id="bombardCount" class="badge">0</span>';rail.appendChild(btn);
function syncBomb(){d.getElementById('bombardCount').textContent=bombard;btn.classList.toggle('locked',bombard<=0);const bal=d.getElementById('shopBalanceValue');if(bal)bal.textContent=medalBalance().toLocaleString('es-ES')+' 🏅'}
function cellEl(r,c){return d.querySelectorAll('.cell')[r*w.N+c]}function boomAt(r,c,hit){const el=cellEl(r,c);if(!el)return;const z=el.getBoundingClientRect(),f=d.createElement('div');f.className='bombFlash';f.textContent=hit?'💥':'🌊';f.style.left=(z.left+z.width/2)+'px';f.style.top=(z.top+z.height/2)+'px';d.body.appendChild(f);setTimeout(()=>f.remove(),600)}
function bombardNow(){if(bombard<=0){d.querySelector('#shop').classList.add('show');return}if(w.busy)return;bombard--;saveBomb();syncBomb();let candidates=[];for(let r=0;r<w.N;r++)for(let c=0;c<w.N;c++){const st=w.state[r][c];if(st===null||(st&&st.type==='hint'))candidates.push([r,c])}for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}const targets=candidates.slice(0,Math.min(5,candidates.length));if(!targets.length)return;w.busy=true;w.showFloat('🚁 BOMBARDEO');let i=0;function strike(){if(i>=targets.length){w.resolveSunk();w.render();w.update();w.save();w.busy=false;if(w.ships.every(s=>s.sunk))setTimeout(()=>w.winZone(),220);return}const [r,c]=targets[i++];if(w.state[r][c]&&w.state[r][c].type==='hint')w.state[r][c]=null;const s=w.shipAt(r,c);w.shots++;if(s){w.hits++;s.hits.add(w.key(r,c));w.state[r][c]={type:'hit'};w.logicalReveal(s,r,c)}else w.state[r][c]={type:'water',n:w.clue(r,c),auto:false};w.render();w.update();setTimeout(()=>{boomAt(r,c,!!s);if(navigator.vibrate)navigator.vibrate(s?45:20)},20);setTimeout(strike,280)}strike()}
btn.onclick=e=>{e.preventDefault();bombardNow()};
const shop=d.querySelector('#shop .modal');const oldGrid=shop.querySelector('.shopGrid');if(oldGrid){const bal=d.createElement('div');bal.className='shopBalance';bal.innerHTML='SALDO: <b id="shopBalanceValue">0 🏅</b>';oldGrid.parentNode.insertBefore(bal,oldGrid);const title=d.createElement('div');title.className='arsenalTitle';title.textContent='PODERES';oldGrid.parentNode.insertBefore(title,oldGrid.nextSibling);const pg=d.createElement('div');pg.className='powerShop';pg.innerHTML=`<div class="powerBuy"><div class="pi">📡</div><b>SONAR</b><small>Escanea una zona 3×3 y revela agua y pistas.</small><button data-p="sonar" data-cost="150">150 🏅</button></div><div class="powerBuy"><div class="pi">💣</div><b>CARGA</b><small>Ataca una zona 3×3 y puede alcanzar varios barcos.</small><button data-p="depth" data-cost="250">250 🏅</button></div><div class="powerBuy"><div class="pi">🎯</div><b>RASTREO</b><small>Marca una casilla especialmente prometedora.</small><button data-p="hint" data-cost="300">300 🏅</button></div><div class="powerBuy"><div class="pi">🚁</div><b>BOMBARDEO</b><small>Lanza 5 ataques sobre casillas aleatorias sin gastar torpedos.</small><button data-p="bombard" data-cost="450">450 🏅</button></div><div class="powerBuy"><div class="pi">🚀</div><b>+5 TORPEDOS</b><small>Añade cinco torpedos inmediatamente.</small><button data-p="ammo" data-cost="200">200 🏅</button></div>`;oldGrid.parentNode.insertBefore(pg,oldGrid.nextSibling.nextSibling);pg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const cost=+b.dataset.cost;if(!spend(cost))return;const p=b.dataset.p;if(p==='bombard')bombard++;else if(p==='ammo')w.ammo+=5;else w.powers[p]=(w.powers[p]||0)+1;w.save();saveBomb();w.update();syncBomb();w.showFloat('✅ COMPRADO')})}
const oldUpdate=w.update;w.update=function(){oldUpdate();if(w.powers.sonar>0)d.getElementById('sonarBtn').classList.remove('locked');if(w.powers.depth>0)d.getElementById('depthBtn').classList.remove('locked');if(w.powers.hint>0)d.getElementById('hintBtn').classList.remove('locked');syncBomb()};d.getElementById('sonarBtn').onclick=()=>{if((w.powers.sonar||0)<=0){d.querySelector('#shop').classList.add('show');return}w.power=w.power==='sonar'?null:'sonar';w.update()};d.getElementById('depthBtn').onclick=()=>{if((w.powers.depth||0)<=0){d.querySelector('#shop').classList.add('show');return}w.power=w.power==='depth'?null:'depth';w.update()};d.getElementById('hintBtn').onclick=()=>{if((w.powers.hint||0)<=0){d.querySelector('#shop').classList.add('show');return}w.hint()};d.getElementById('shopPlus').onclick=()=>{d.querySelector('#shop').classList.add('show');syncBomb()};d.getElementById('new').addEventListener('click',()=>{bombard=0;saveBomb()},true);syncBomb();w.update();return true}
const timer=setInterval(()=>{if(enhance())clearInterval(timer)},120);setTimeout(()=>clearInterval(timer),12000);
</script></body></html>
