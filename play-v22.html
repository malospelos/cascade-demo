function renderMissions(c){c.innerHTML='<div class="sectionTitle">MISIONES ACTIVAS</div>';missionDefs.forEach(m=>{const val=Math.min(m.goal,m.value()),done=val>=m.goal,claimed=!!meta.claimed[m.id],d=document.createElement('div');d.className='missionCard';d.innerHTML='<div class="missionTop"><h3>'+m.title+'</h3><span>'+val+'/'+m.goal+'</span></div><p>'+m.desc+'</p><div class="progressBarMini"><span style="width:'+(val/m.goal*100)+'%"></span></div><div class="missionTop"><small>🎁 '+m.reward+'</small><button class="claimBtn" '+(!done||claimed?'disabled':'')+'>'+(claimed?'COBRADA':'COBRAR')+'</button></div>';d.querySelector('button').onclick=()=>{if(!done||claimed)return;m.claim();meta.claimed[m.id]=true;saveMeta();save();update();renderMissions(c);showFloat('🎁 RECOMPENSA')};c.appendChild(d)})}

let aidAtZoneStart=0;function aidCount(){return (powers.sonar||0)+(powers.depth||0)+(powers.hint||0)}aidAtZoneStart=aidCount();const prevResolve=resolveSunk;resolveSunk=function(){const before=ships.filter(s=>s.sunk).length;prevResolve();const newly=ships.filter(s=>s.sunk).length-before;if(newly>0){meta.sunk+=newly;ships.filter(s=>s.sunk).forEach(s=>{if(s.len===2)unlock('patrol');if(s.len===3)unlock('sub');if(s.len===4)unlock('cruiser');if(s.len>=5)unlock('carrier');if(s.boss)unlock('titan')});saveMeta()}};
