const DAILY_SAVE='cascadeHuntDailyV21',DAILY_META='cascadeHuntDailyMetaV21';let dailyMode=false,dailyAids=0,dailyDate='',dailySeed=0,dailyFinished=false;baseSave=save;const baseUpdateDaily=update,baseWinDaily=winZone,baseSonarDaily=sonarAt,baseDepthDaily=depthAt,baseHintDaily=hint;
function utcDate(){return new Date().toISOString().slice(0,10)}function hashDate(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function dailyNo(){const base=Date.UTC(2026,0,1),now=Date.parse(utcDate()+'T00:00:00Z');return Math.floor((now-base)/86400000)+1}function yesterday(s){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function buildDailyFleet(){ships=[];const lens=[2,2,3,3,4];for(let id=0;id<lens.length;id++){let len=lens[id],ok=false;for(let t=0;t<4000&&!ok;t++){let h=rr()<.5,r=h?Math.floor(rr()*N):Math.floor(rr()*(N-len+1)),c=h?Math.floor(rr()*(N-len+1)):Math.floor(rr()*N),cells=[];for(let i=0;i<len;i++)cells.push([r+(h?0:i),c+(h?i:0)]);if(touching(cells))continue;ships.push({id,len,cells,hits:new Set(),sunk:false});ok=true}if(!ok){id=-1;ships=[]}}state=Array.from({length:N},()=>Array(N).fill(null))}

function addDailyButton(){if(document.getElementById('dailyBtn'))return;const b=document.createElement('button');b.id='dailyBtn';b.className='dailyBtn';b.textContent='📅 DESAFÍO DIARIO';b.onclick=openDailyHome;document.querySelector('.footer').appendChild(b)}

function clearDailyIndicators(){document.querySelector('.dailyBadge')?.remove();document.querySelector('.dailyActivePill')?.remove()}
function enterDaily(){baseSave();dailyMode=true;dailyDate=utcDate();dailySeed=hashDate('CASCADE-HUNT-'+dailyDate);dailyFinished=false;document.body.classList.add('dailyMode');if(!loadDaily()){N=8;seed=dailySeed;rr=rng(dailySeed);buildDailyFleet();ammo=99;maxAmmo=99;lastRegenAt=Date.now();shots=0;hits=0;streak=0;power=null;powers={sonar:1,depth:1,hint:1};dailyAids=0;busy=false;saveDaily()}render();update();addDailyIndicators();document.getElementById('dailyHome')?.classList.remove('show');if(dailyFinished)setTimeout(showDailyResult,100)}
function exitDaily(){dailyMode=false;document.body.classList.remove('dailyMode');clearDailyIndicators();location.reload()}
function openDailyHome(){let o=document.getElementById('dailyHome');if(!o){o=document.createElement('div');o.id='dailyHome';o.className='overlay';o.innerHTML='<div class="modal"><h2>📅 DESAFÍO DIARIO</h2><div class="dailyHero">⚓</div><div class="big" id="dailyNoTitle"></div><div class="dailyInfo">Todos los jugadores reciben exactamente el mismo tablero durante el día UTC. No hay reinicio ni reroll. Gana quien resuelva la flota con menos disparos y menos ayudas.</div><div class="dailyStats"><div class="dailyStat"><b>8×8</b>TABLERO</div><div class="dailyStat"><b>5</b>BARCOS</div><div class="dailyStat"><b>3</b>AYUDAS</div></div><div class="near">Incluye 1 Sonar, 1 Carga y 1 Rastreo. El Bombardeo está desactivado para mantener el desafío comparable.</div><button id="startDaily" class="full">JUGAR DESAFÍO DE HOY</button><button id="closeDaily" class="full">VOLVER</button></div>';document.body.appendChild(o);o.querySelector('#startDaily').onclick=enterDaily;o.querySelector('#closeDaily').onclick=()=>o.classList.remove('show')}o.querySelector('#dailyNoTitle').textContent='DESAFÍO #'+dailyNo();const saved=(()=>{try{return JSON.parse(localStorage.getItem(DAILY_SAVE)||'null')}catch(e){return null}})();o.querySelector('#startDaily').textContent=saved&&saved.date===utcDate()?(saved.finished?'VER RESULTADO DE HOY':'CONTINUAR DESAFÍO'):'JUGAR DESAFÍO DE HOY';o.classList.add('show')}
function updateStreak(){let m;try{m=JSON.parse(localStorage.getItem(DAILY_META)||'null')||{}}catch(e){m={}}if(m.last===dailyDate)return m.streak||1;let s=m.last===yesterday(dailyDate)?(m.streak||0)+1:1;m={last:dailyDate,streak:s};localStorage.setItem(DAILY_META,JSON.stringify(m));return s}function currentStreak(){try{return(JSON.parse(localStorage.getItem(DAILY_META)||'null')||{}).streak||0}catch(e){return 0}}
function resultGrid(){const acc=shots?hits/shots:0,total=20,good=Math.round(total*acc);let arr=Array(total).fill('⬜');for(let i=0;i<good;i++)arr[i]='🟦';let r=rng(dailySeed^shots^(dailyAids<<8));for(let i=arr.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return Array.from({length:4},(_,r)=>arr.slice(r*5,r*5+5).join('')).join('\n')}
function shareText(){const acc=shots?Math.round(hits/shots*100):0;return'CASCADE HUNT · DESAFÍO #'+dailyNo()+'\n'+resultGrid()+'\n🎯 '+shots+' disparos · '+acc+'% precisión\n🧰 '+dailyAids+' ayudas · 🔥 '+currentStreak()+' días\n#CascadeHunt'}

sonarAt=function(r,c){if(dailyMode&&powers.sonar>0)dailyAids++;const x=baseSonarDaily(r,c);if(dailyMode){saveDaily();addDailyIndicators()}return x};depthAt=function(r,c){if(dailyMode&&powers.depth>0)dailyAids++;const x=baseDepthDaily(r,c);if(dailyMode){saveDaily();addDailyIndicators()}return x};hint=function(){if(dailyMode&&powers.hint>0)dailyAids++;const x=baseHintDaily();if(dailyMode){saveDaily();addDailyIndicators()}return x};
