<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASCADE Demo</title><style>body{margin:0;background:#111318;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}.app{width:min(94vw,520px)}h1{text-align:center;letter-spacing:.18em;margin:0 0 8px}.sub{text-align:center;color:#9ca7b8;margin-bottom:16px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;background:#232936;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#9ca7b8}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#191d25;padding:12px;border-radius:20px}.cell{aspect-ratio:1;border-radius:16px;box-shadow:inset 0 2px 0 #ffffff33,inset 0 -4px 0 #00000022;transition:.18s;touch-action:manipulation}.cell:active{transform:scale(.9)}.c0{background:#ef4355}.c1{background:#347eeb}.c2{background:#f0b723}.c3{background:#3abb5f}.c4{background:#824de0}.c5{background:#eb7422}.boom{transform:scale(.08);opacity:0}.msg{text-align:center;min-height:70px;padding-top:14px}.msg b{display:block;font-size:18px}.msg small{color:#9ca7b8}button{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-weight:700;background:#f5f7fb;color:#111318;font-size:16px}.note{text-align:center;color:#9ca7b8;font-size:12px;margin-top:10px}</style></head><body><div class="app"><h1>CASCADE</h1><div class="sub">Un toque. Una reacción en cadena.</div><div class="stats"><div class="stat"><b id="score">0</b><span>PUNTOS</span></div><div class="stat"><b id="combo">x0</b><span>CASCADA</span></div><div class="stat"><b id="best">0</b><span>MEJOR</span></div></div><div id="board" class="board"></div><div id="msg" class="msg"><b>Elige un grupo</b><small>Toca un grupo conectado de 3 o más piezas del mismo color.</small></div><button id="retry">Nuevo tablero</button><div class="note">Demo conceptual para iPad y móvil.</div></div><script>const R=8,C=7,K=6;let b=[],used=false,score=0,combo=0,best=+localStorage.getItem('cascadeBest')||0;const E=id=>document.getElementById(id),board=E('board'),msg=E('msg');function rnd(n){return Math.floor(Math.random()*n)}function make(){b=Array.from({length:R},()=>Array.from({length:C},()=>rnd(K)));for(let i=0;i<10;i++){let r=rnd(R),c=rnd(C-1),v=rnd(K);b[r][c]=v;b[r][c+1]=v}used=false;score=combo=0;draw();stats();msg.innerHTML='<b>Elige un grupo</b><small>Solo tienes un toque. Busca la mejor cascada.</small>'}function stats(){E('score').textContent=score;E('combo').textContent='x'+combo;E('best').textContent=best}function draw(){board.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){let d=document.createElement('div');d.className='cell c'+b[r][c];d.onclick=()=>tap(r,c);board.appendChild(d)}}function neigh(r,c){return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([x,y])=>x>=0&&x<R&&y>=0&&y<C)}function group(sr,sc){let v=b[sr][sc],q=[[sr,sc]],seen=new Set(),out=[];while(q.length){let [r,c]=q.pop(),k=r+','+c;if(seen.has(k))continue;seen.add(k);if(b[r][c]!==v)continue;out.push([r,c]);neigh(r,c).forEach(n=>q.push(n))}return out}function matches(){let s=new Set();for(let r=0;r<R;r++){let st=0;for(let c=1;c<=C;c++){if(c<C&&b[r][c]===b[r][st])continue;if(c-st>=3)for(let k=st;k<c;k++)s.add(r+','+k);st=c}}for(let c=0;c<C;c++){let st=0;for(let r=1;r<=R;r++){if(r<R&&b[r][c]===b[st][c])continue;if(r-st>=3)for(let k=st;k<r;k++)s.add(k+','+c);st=r}}return[...s].map(x=>x.split(',').map(Number))}function drop(dead){let ds=new Set(dead.map(([r,c])=>r+','+c)),nb=Array.from({length:R},()=>Array(C));for(let c=0;c<C;c++){let vals=[];for(let r=R-1;r>=0;r--)if(!ds.has(r+','+c))vals.push(b[r][c]);while(vals.length<R)vals.push(rnd(K));for(let r=R-1,i=0;r>=0;r--,i++)nb[r][c]=vals[i]}b=nb}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function explode(cells){while(cells.length){combo++;score+=cells.length*combo;stats();[...board.children].forEach((n,i)=>{let r=Math.floor(i/C),c=i%C;if(cells.some(x=>x[0]===r&&x[1]===c))n.classList.add('boom')});await wait(220);drop(cells);draw();await wait(220);cells=matches()}if(score>best){best=score;localStorage.setItem('cascadeBest',best)}stats();msg.innerHTML='<b>Resultado: '+score+' puntos</b><small>'+combo+' oleadas. Pulsa Nuevo tablero para volver a jugar.</small>'}async function tap(r,c){if(used)return;let g=group(r,c);if(g.length<3){msg.innerHTML='<b>Ese grupo no vale</b><small>Necesitas 3 o más piezas conectadas.</small>';return}used=true;await explode(g)}E('retry').onclick=make;make();</script></body></html>
