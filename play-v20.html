<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07516d"><title>CASCADE HUNT v20</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063f5a;touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#063f5a}</style></head><body><iframe id="game" src="play-v19.html?v20fix=2"></iframe><script>
const rootFrame=document.getElementById('game');
const bossCode=String.raw`(function(){
if(document.getElementById('v20Marker'))return;const marker=document.createElement('meta');marker.id='v20Marker';document.head.appendChild(marker);
const css=document.createElement('style');css.textContent='.bossBanner,.bossSafeBanner,.bossStatus,.worldBadge{display:none!important}.bossTitanRow{background:linear-gradient(90deg,#5c251f55,#9c493355,#5c251f55);border:1px solid #ffcb6644;border-radius:8px!important}.titanTag{display:block;font-size:6px;color:#ffd86c;font-weight:1000;letter-spacing:.05em}.titanFleetInfo{margin:0 2px 5px;padding:5px 3px;border-radius:8px;background:#5b2924;border:1px solid #ffd06655;text-align:center;font-size:7px;line-height:1.25;color:#ffe59a;font-weight:1000;pointer-events:none}.cell.bossArmor{outline:3px solid #ffd45f!important;box-shadow:0 0 18px #ffd45f99,inset 0 0 12px #ff9f3377!important}.cell.bossArmor .cellInner:after{content:"🛡️";font-size:15px}.bossIntroIcon{font-size:48px;text-align:center;margin:4px 0}.bossMechanics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.bossMechanics div{background:#ffffff0c;border:1px solid #ffffff1a;border-radius:10px;padding:8px;text-align:center;font-size:9px}.bossMechanics b{display:block;font-size:17px;color:#ffe07b;margin-bottom:2px}.bossZone .zoneSub{color:#ffe38b;text-shadow:0 2px 4px #3b190d;font-size:9px;letter-spacing:.08em}.bossZone .fleetLabel{color:#ffe18a}@media(max-height:700px){.titanFleetInfo{font-size:6px;padding:3px 2px;margin-bottom:3px}.bossZone .zoneSub{font-size:8px}}';document.head.appendChild(css);
function bossZone(){return zone%5===0}function bossTitan(){return ships.find(s=>s.boss)}function armorKeySet(s){return new Set((s&&s.armorCells)||[])}function damaged(s,k){return !!(s&&s.armorDamage&&s.armorDamage[k])}
function buildBossFleet(){ships=[];const lens=[2,3,4,6];for(let id=0;id<lens.length;id++){let len=lens[id],ok=false;for(let t=0;t<3500&&!ok;t++){let h=rr()<.5,r=h?Math.floor(rr()*N):Math.floor(rr()*(N-len+1)),c=h?Math.floor(rr()*(N-len+1)):Math.floor(rr()*N),cells=[];for(let i=0;i<len;i++)cells.push([r+(h?0:i),c+(h?i:0)]);if(touching(cells))continue;const s={id,len,cells,hits:new Set(),sunk:false};if(len===6){s.boss=true;const ix=[1,4];s.armorCells=ix.map(i=>key(cells[i][0],cells[i][1]));s.armorDamage={}}ships.push(s);ok=true}if(!ok){id=-1;ships=[]}}state=Array.from({length:N},()=>Array(N).fill(null))}
const baseBuildFleet=buildFleet;buildFleet=function(){if(bossZone())buildBossFleet();else baseBuildFleet()};
const baseShot=shot;function bossShot(r,c){if(busy||state[r][c]!==null)return;const s=shipAt(r,c),k=key(r,c);if(s&&s.boss&&armorKeySet(s).has(k)&&!damaged(s,k)){if(!consume()){showEmpty();return}busy=true;shots++;s.armorDamage=s.armorDamage||{};s.armorDamage[k]=1;showFloat('🛡️ BLINDAJE DAÑADO');render();update();save();setTimeout(()=>{busy=false;if(ammo<=0)showEmpty()},260);return}return baseShot(r,c)}shot=bossShot;
function decorateBossCells(){const s=bossTitan();if(!s||s.sunk)return;const cells=[...document.querySelectorAll('.cell')];(s.armorCells||[]).forEach(k=>{if(!s.armorDamage||!s.armorDamage[k])return;const [r,c]=k.split(',').map(Number);const el=cells[r*N+c];if(el&&state[r][c]===null)el.classList.add('bossArmor')})}
const baseRender=render;render=function(){baseRender();setTimeout(()=>{decorateBossCells();syncBossUI()},0)};
const baseFleet=renderFleet;renderFleet=function(){baseFleet();const panel=document.querySelector('.fleetPanel'),fleet=document.getElementById('fleet');const old=document.querySelector('.titanFleetInfo');if(old)old.remove();const s=bossTitan();if(!s)return;const rows=[...document.querySelectorAll('.shipRow')],idx=ships.indexOf(s),row=rows[idx];if(row){row.classList.add('bossTitanRow');const shape=row.querySelector('.shipShape');if(shape)shape.innerHTML=(s.sunk?'⚓':'🛳️')+'<span class="titanTag">TITÁN</span>';const dots=row.querySelector('.shipDots');if(dots){const armor=armorKeySet(s);dots.innerHTML=s.cells.map(([r,c])=>{const k=key(r,c);if(s.hits.has(k))return '●';if(armor.has(k)&&damaged(s,k))return '◈';if(armor.has(k))return '◆';return '○'}).join('')}}const info=document.createElement('div');info.className='titanFleetInfo';const remaining=s.len-s.hits.size,armorLeft=(s.armorCells||[]).filter(k=>!s.hits.has(k)).length;info.innerHTML='👑 TITÁN '+remaining+'/6<br>🛡️ BLINDAJE '+armorLeft+'/2';panel.insertBefore(info,fleet)}
function syncBossUI(){const bz=bossZone();document.body.classList.toggle('bossZone',bz);const stray=document.querySelector('.bossSafeBanner');if(stray)stray.style.display='none';const stat=document.querySelector('.bossStatus');if(stat)stat.style.display='none';const wb=document.querySelector('.worldBadge');if(wb)wb.style.display='none';if(bz){document.getElementById('zoneSub').textContent=N+'×'+N+' · 👑 SUBMARINO TITÁN · 2 BLINDAJES'}else{document.getElementById('zoneSub').textContent=N+'×'+N+' · '+cfg().name}}
function bossIntro(){if(!bossZone())return;let o=document.getElementById('bossIntroV20');if(!o){o=document.createElement('div');o.id='bossIntroV20';o.className='overlay';o.innerHTML='<div class="modal"><h2>👑 CONTACTO DE ÉLITE</h2><div class="bossIntroIcon">🛳️</div><div class="big">SUBMARINO TITÁN</div><p style="text-align:center">Este jefe es diferente a una zona normal.</p><div class="bossMechanics"><div><b>6</b>SECCIONES</div><div><b>2 🛡️</b>BLINDADAS</div></div><div class="near">Los segmentos blindados necesitan <b>dos impactos directos</b>: el primero rompe el blindaje y el segundo daña la sección. El resto de las reglas de deducción se mantienen.</div><button id="bossStartV20" class="full">COMENZAR BATALLA</button></div>';document.body.appendChild(o);o.querySelector('#bossStartV20').onclick=()=>o.classList.remove('show')}o.classList.add('show')}
let introZone=0;const baseNewZone=newZone;newZone=function(){baseNewZone();if(bossZone()&&introZone!==zone){introZone=zone;setTimeout(bossIntro,120)}syncBossUI()};
const baseUpdate=update;update=function(){baseUpdate();syncBossUI()};
const baseResolve=resolveSunk;resolveSunk=function(){const t=bossTitan(),was=t&&t.sunk;baseResolve();if(t&&!was&&t.sunk)showFloat('👑 TITÁN HUNDIDO')};
if(bossZone()&&!bossTitan()){N=cfg().n;buildBossFleet();power=null;render();update();save();setTimeout(bossIntro,150);introZone=zone}else{syncBossUI();decorateBossCells();renderFleet()}
})();`;
function deepestDoc(){try{let d=rootFrame.contentDocument;if(!d)return null;for(let i=0;i<8;i++){const f=d.getElementById('game');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function inject(){const d=deepestDoc();if(!d||!d.querySelector('.rightRail'))return false;if(d.getElementById('v20Marker'))return true;const s=d.createElement('script');s.textContent=bossCode;d.body.appendChild(s);return true}
const t=setInterval(()=>{if(inject())clearInterval(t)},220);setTimeout(()=>clearInterval(t),20000);
</script></body></html>
