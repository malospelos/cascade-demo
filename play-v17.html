<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07516d"><title>CASCADE HUNT v17</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063f5a;touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#063f5a}</style></head><body><iframe id="game" src="play-v15.html?v17=1"></iframe><script>
const frame=document.getElementById('game');
const injected=String.raw`(function(){
if(document.getElementById('bombardBtn'))return;
const st=document.createElement('style');st.textContent='.rightRail{gap:7px!important}.hex{height:58px!important;min-height:0!important}.bombardBtn{background:linear-gradient(145deg,#e46e47,#a73734 60%,#762837)!important}.arsenalTitle{font-size:11px;font-weight:1000;letter-spacing:.08em;color:#ffe48b;margin:12px 0 6px}.powerShop{display:grid;grid-template-columns:1fr 1fr;gap:7px}.powerBuy{border:1px solid #ffffff20;border-radius:12px;background:#ffffff0c;padding:9px;text-align:center}.powerBuy .pi{font-size:27px}.powerBuy b{display:block;font-size:11px;margin:3px 0}.powerBuy small{display:block;color:#b8cbd6;font-size:8px;line-height:1.25;min-height:31px}.powerBuy button{width:100%;border:0;border-radius:9px;padding:8px 4px;margin-top:6px;background:#ffd75b;color:#17343d;font-size:10px;font-weight:1000}.shopBalance{text-align:center;background:#062f46;border:1px solid #ffffff1d;border-radius:10px;padding:7px;font-size:12px;margin-bottom:8px}.bombFlash{position:fixed;z-index:9999;pointer-events:none;font-size:38px;transform:translate(-50%,-50%);animation:bombPop .6s ease-out forwards}.bombTarget{outline:3px solid #ffd75a!important;box-shadow:0 0 18px #ffd75a99!important;transform:scale(.92)!important}@keyframes bombPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-90%) scale(.85)}}@media(max-height:700px){.hex{height:47px!important}.hex .ico{line-height:25px!important;font-size:19px!important}.rightRail{gap:5px!important}}';document.head.appendChild(st);
let bombard=+(localStorage.getItem('cascadeHuntV17Bombard')||0);
function saveBomb(){localStorage.setItem('cascadeHuntV17Bombard',String(bombard))}
function sync(){const c=document.getElementById('bombardCount');if(c)c.textContent=bombard;const b=document.getElementById('bombardBtn');if(b)b.classList.toggle('locked',bombard<=0);const s=document.getElementById('shopBalanceValue');if(s)s.textContent=coins.toLocaleString('es-ES')+' 🏅'}
function cellEl(r,c){return document.querySelectorAll('.cell')[r*N+c]||null}
function boomAt(r,c,hit){const el=cellEl(r,c);if(!el)return;const z=el.getBoundingClientRect(),f=document.createElement('div');f.className='bombFlash';f.textContent=hit?'💥':'🌊';f.style.left=(z.left+z.width/2)+'px';f.style.top=(z.top+z.height/2)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),650)}
function revealBomb(r,c){if(state[r][c]&&state[r][c].type==='hint')state[r][c]=null;const s=shipAt(r,c);shots++;if(s){hits++;s.hits.add(key(r,c));state[r][c]={type:'hit'};logicalReveal(s,r,c)}else state[r][c]={type:'water',n:clue(r,c),auto:false};return !!s}
function bombardNow(){if(bombard<=0){document.getElementById('shop').classList.add('show');return}if(busy)return;let candidates=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const st=state[r][c];if(st===null||(st&&st.type==='hint'))candidates.push([r,c])}if(!candidates.length)return;for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}const targets=candidates.slice(0,Math.min(5,candidates.length));bombard--;saveBomb();sync();busy=true;showFloat('🚁 BOMBARDEO');let i=0;function strike(){if(i>=targets.length){resolveSunk();render();update();save();busy=false;if(ships.every(s=>s.sunk))setTimeout(winZone,250);return}const [r,c]=targets[i++];const pre=cellEl(r,c);if(pre){pre.classList.add('bombTarget');setTimeout(()=>pre.classList.remove('bombTarget'),160)}setTimeout(()=>{const hit=revealBomb(r,c);resolveSunk();render();update();save();setTimeout(()=>boomAt(r,c,hit),25);setTimeout(strike,300)},170)}strike()}
const rail=document.querySelector('.rightRail'),btn=document.createElement('button');btn.id='bombardBtn';btn.className='hex bombardBtn';btn.innerHTML='<span class="ico">🚁</span><span class="name">BOMBARDEO</span><span id="bombardCount" class="badge">0</span>';btn.onclick=e=>{e.preventDefault();e.stopPropagation();bombardNow()};rail.appendChild(btn);
const shop=document.querySelector('#shop .modal'),grid=shop.querySelector('.shopGrid');if(grid){const bal=document.createElement('div');bal.className='shopBalance';bal.innerHTML='SALDO: <b id="shopBalanceValue">0 🏅</b>';grid.parentNode.insertBefore(bal,grid);const title=document.createElement('div');title.className='arsenalTitle';title.textContent='PODERES';grid.parentNode.insertBefore(title,grid.nextSibling);const pg=document.createElement('div');pg.className='powerShop';pg.innerHTML='<div class="powerBuy"><div class="pi">📡</div><b>SONAR</b><small>Escanea una zona 3×3 y revela agua y pistas.</small><button data-p="sonar" data-cost="150">150 🏅</button></div><div class="powerBuy"><div class="pi">💣</div><b>CARGA</b><small>Ataca una zona 3×3 y puede alcanzar varios barcos.</small><button data-p="depth" data-cost="250">250 🏅</button></div><div class="powerBuy"><div class="pi">🎯</div><b>RASTREO</b><small>Marca una casilla especialmente prometedora.</small><button data-p="hint" data-cost="300">300 🏅</button></div><div class="powerBuy"><div class="pi">🚁</div><b>BOMBARDEO</b><small>Lanza 5 ataques aleatorios sin gastar torpedos.</small><button data-p="bombard" data-cost="450">450 🏅</button></div><div class="powerBuy"><div class="pi">🚀</div><b>+5 TORPEDOS</b><small>Añade cinco torpedos inmediatamente.</small><button data-p="ammo" data-cost="200">200 🏅</button></div>';grid.parentNode.insertBefore(pg,grid.nextSibling.nextSibling);pg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const cost=+b.dataset.cost;if(coins<cost){showFloat('🏅 FALTAN MEDALLAS');return}coins-=cost;const p=b.dataset.p;if(p==='bombard')bombard++;else if(p==='ammo')ammo+=5;else powers[p]=(powers[p]||0)+1;saveBomb();update();save();sync();showFloat('✅ COMPRADO')})}
const baseUpdate=update;update=function(){baseUpdate();if(powers.sonar>0)document.getElementById('sonarBtn').classList.remove('locked');if(powers.depth>0)document.getElementById('depthBtn').classList.remove('locked');if(powers.hint>0)document.getElementById('hintBtn').classList.remove('locked');sync()};
document.getElementById('sonarBtn').onclick=()=>{if((powers.sonar||0)<=0){document.getElementById('shop').classList.add('show');return}power=power==='sonar'?null:'sonar';update()};document.getElementById('depthBtn').onclick=()=>{if((powers.depth||0)<=0){document.getElementById('shop').classList.add('show');return}power=power==='depth'?null:'depth';update()};document.getElementById('hintBtn').onclick=()=>{if((powers.hint||0)<=0){document.getElementById('shop').classList.add('show');return}hint()};document.getElementById('shopPlus').onclick=()=>{document.getElementById('shop').classList.add('show');sync()};document.getElementById('new').addEventListener('click',()=>{bombard=0;saveBomb()},true);sync();update();
})();`;
function inject(){try{const d=frame.contentDocument;if(!d||!d.querySelector('.rightRail')||d.getElementById('bombardBtn'))return !!d?.getElementById('bombardBtn');const s=d.createElement('script');s.textContent=injected;d.body.appendChild(s);return true}catch(e){return false}}
const t=setInterval(()=>{if(inject())clearInterval(t)},150);setTimeout(()=>clearInterval(t),12000);
</script></body></html>
