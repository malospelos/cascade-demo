<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07516d"><title>CASCADE HUNT v18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063f5a;touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#063f5a}</style></head><body><iframe id="game" src="play-v17.html?v18=1"></iframe><script>
const outer=document.getElementById('game');
const code=String.raw`(function(){
if(document.getElementById('v18Marker'))return;
const marker=document.createElement('meta');marker.id='v18Marker';document.head.appendChild(marker);
const css=document.createElement('style');css.textContent='.cell.autoWater{background:linear-gradient(145deg,#0a4b6690,#073f5790)!important;border-color:#69a9bd38!important;opacity:.52!important}.cell.shotWater{background:linear-gradient(145deg,#166c8799,#0a526d99)!important;border-color:#b6efff72!important;opacity:.9!important}.cell.possible{outline:3px solid #ffe66a!important;box-shadow:0 0 18px #ffe66a99!important;animation:possPulse 1s ease-in-out infinite}.cell.manualMark:after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe16d;font-size:20px;font-weight:1000;text-shadow:0 2px 3px #001;z-index:8}.cell.manualMark{box-shadow:inset 0 0 0 3px #ffe16d88!important}.cell.hintMark{outline:3px dashed #ff9f55!important;box-shadow:0 0 18px #ff9f5588!important}.remainingInfo{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:22;background:#052f46d9;border:1px solid #ffffff20;border-radius:10px;padding:4px 8px;font-size:8px;font-weight:1000;white-space:nowrap}.infoDot{position:absolute;left:-6px;top:-6px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:#0a5774;border:2px solid #7edcf4;font-size:10px;font-weight:1000;z-index:5;box-shadow:0 2px 4px #0016}.powerInfoGrid{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;background:#ffffff0b;border:1px solid #ffffff18;border-radius:12px;padding:10px;margin:10px 0}.powerInfoGrid .bigIcon{font-size:35px}.powerInfoGrid b{display:block;color:#ffe173;margin-bottom:3px}.powerInfoGrid small{color:#bfd2db;line-height:1.35}.markHelp{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);z-index:14;background:#052d43c7;border:1px solid #ffffff1c;border-radius:10px;padding:4px 7px;font-size:7px;color:#bfe5ef;white-space:nowrap}@keyframes possPulse{50%{filter:brightness(1.35)}}@media(max-height:700px){.remainingInfo{top:57px}.markHelp{bottom:35px}.cell.manualMark:after{font-size:16px}}';document.head.appendChild(css);
let manualMarks=new Set();let holdTimer=null,holdCell=null,held=false;
function mk(r,c){return r+','+c}function rcFromCell(el){const arr=[...document.querySelectorAll('.cell')],i=arr.indexOf(el);return i<0?null:[Math.floor(i/N),i%N]}
function cleanMarks(){for(const m of [...manualMarks]){const [r,c]=m.split(',').map(Number);const st=state[r]&&state[r][c];if(st!==null&&!(st&&st.type==='hint'))manualMarks.delete(m)}}
function decorate(){cleanMarks();const cells=[...document.querySelectorAll('.cell')];cells.forEach((el,i)=>{const r=Math.floor(i/N),c=i%N,st=state[r]&&state[r][c];el.classList.remove('autoWater','shotWater','manualMark','hintMark');if(st&&st.type==='water')el.classList.add(st.auto?'autoWater':'shotWater');if(st&&st.type==='hint')el.classList.add('hintMark');if(manualMarks.has(mk(r,c))&&(st===null||(st&&st.type==='hint')))el.classList.add('manualMark')});const rem=ships.filter(s=>!s.sunk).length,ri=document.querySelector('.remainingInfo');if(ri)ri.textContent=rem===1?'1 BARCO RESTANTE':rem+' BARCOS RESTANTES'}
function highlightPossible(){document.querySelectorAll('.cell.possible').forEach(x=>x.classList.remove('possible'));const candidates=new Set();ships.filter(s=>!s.sunk&&s.hits&&s.hits.size>0).forEach(s=>{const hs=[...s.hits].map(x=>x.split(',').map(Number));if(hs.length===1){const [r,c]=hs[0];[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,b])=>{if(a>=0&&b>=0&&a<N&&b<N&&state[a][b]===null)candidates.add(mk(a,b))})}else{const sameR=hs.every(x=>x[0]===hs[0][0]);if(sameR){const r=hs[0][0],cols=hs.map(x=>x[1]);[[r,Math.min(...cols)-1],[r,Math.max(...cols)+1]].forEach(([a,b])=>{if(b>=0&&b<N&&state[a][b]===null)candidates.add(mk(a,b))})}else{const c=hs[0][1],rows=hs.map(x=>x[0]);[[Math.min(...rows)-1,c],[Math.max(...rows)+1,c]].forEach(([a,b])=>{if(a>=0&&a<N&&state[a][b]===null)candidates.add(mk(a,b))})}}});const cells=[...document.querySelectorAll('.cell')];for(const m of candidates){const [r,c]=m.split(',').map(Number),el=cells[r*N+c];if(el)el.classList.add('possible')}if(candidates.size)setTimeout(()=>document.querySelectorAll('.cell.possible').forEach(x=>x.classList.remove('possible')),1800)}
function addStatus(){if(document.querySelector('.remainingInfo'))return;const ri=document.createElement('div');ri.className='remainingInfo';document.querySelector('.header').appendChild(ri);const mh=document.createElement('div');mh.className='markHelp';mh.textContent='MANTÉN PULSADO UNA CASILLA PARA MARCAR ?';document.querySelector('.playfield').appendChild(mh)}
function powerInfo(title,icon,text,cost){let o=document.getElementById('powerInfoV18');if(!o){o=document.createElement('div');o.id='powerInfoV18';o.className='overlay';o.innerHTML='<div class="modal"><h2 id="pih"></h2><div class="powerInfoGrid"><div class="bigIcon" id="pii"></div><div><b id="pit"></b><small id="pix"></small></div></div><div class="near" id="pic"></div><button class="full" id="piclose">ENTENDIDO</button></div>';document.body.appendChild(o);o.querySelector('#piclose').onclick=()=>o.classList.remove('show');o.addEventListener('pointerdown',e=>{if(e.target===o)o.classList.remove('show')})}o.querySelector('#pih').textContent='¿PARA QUÉ SIRVE?';o.querySelector('#pii').textContent=icon;o.querySelector('#pit').textContent=title;o.querySelector('#pix').textContent=text;o.querySelector('#pic').textContent='Precio en Arsenal: '+cost+' medallas';o.classList.add('show')}
function addPowerInfo(){const data={sonarBtn:['SONAR','📡','Escanea una zona 3×3 y revela agua y pistas sin disparar. Ideal para obtener información.',100],depthBtn:['CARGA DE PROFUNDIDAD','💣','Tú eliges el centro y ataca una zona 3×3. Puede alcanzar varios segmentos de barco.',250],hintBtn:['RASTREO','🎯','Marca una casilla especialmente prometedora para tu siguiente disparo. No consume torpedo.',150],bombardBtn:['BOMBARDEO','🚁','Lanza 5 ataques automáticos sobre casillas ocultas aleatorias de todo el tablero.',400]};Object.entries(data).forEach(([id,v])=>{const b=document.getElementById(id);if(!b||b.querySelector('.infoDot'))return;const i=document.createElement('span');i.className='infoDot';i.textContent='i';i.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();powerInfo(...v)});i.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});b.appendChild(i)})}
function adjustPrices(){document.querySelectorAll('.powerBuy button').forEach(b=>{const p=b.dataset.p;if(p==='sonar'){b.dataset.cost='100';b.textContent='100 🏅'}if(p==='hint'){b.dataset.cost='150';b.textContent='150 🏅'}if(p==='depth'){b.dataset.cost='250';b.textContent='250 🏅'}if(p==='bombard'){b.dataset.cost='400';b.textContent='400 🏅'}if(p==='ammo'){b.dataset.cost='200';b.textContent='200 🏅'}})}
document.addEventListener('pointerdown',e=>{const cell=e.target.closest&&e.target.closest('.cell');if(!cell)return;held=false;holdCell=cell;holdTimer=setTimeout(()=>{const rc=rcFromCell(cell);if(!rc)return;const [r,c]=rc,st=state[r][c];if(st!==null&&!(st&&st.type==='hint'))return;held=true;const k=mk(r,c);manualMarks.has(k)?manualMarks.delete(k):manualMarks.add(k);decorate();showFloat(manualMarks.has(k)?'❓ MARCADA':'MARCA QUITADA');if(navigator.vibrate)navigator.vibrate(35)},520)},true);document.addEventListener('pointerup',()=>{clearTimeout(holdTimer)},true);document.addEventListener('pointercancel',()=>{clearTimeout(holdTimer)},true);document.addEventListener('click',e=>{if(held&&e.target.closest&&e.target.closest('.cell')){e.preventDefault();e.stopImmediatePropagation();held=false}},true);
const oldRender=render;render=function(){oldRender();setTimeout(()=>{decorate();addStatus();addPowerInfo();adjustPrices()},0)};const oldResolve=resolveSunk;resolveSunk=function(){const before=ships.reduce((n,s)=>n+(s.hits?s.hits.size:0),0);oldResolve();const after=ships.reduce((n,s)=>n+(s.hits?s.hits.size:0),0);setTimeout(()=>{decorate();if(after>=before)highlightPossible()},25)};const oldUpdate=update;update=function(){oldUpdate();decorate();addPowerInfo();adjustPrices()};addStatus();decorate();addPowerInfo();adjustPrices();
})();`;
function injectIntoDeep(){try{const d1=outer.contentDocument;if(!d1)return false;const inner=d1.getElementById('game');if(!inner)return false;const d=inner.contentDocument;if(!d||!d.querySelector('.rightRail'))return false;if(d.getElementById('v18Marker'))return true;const s=d.createElement('script');s.textContent=code;d.body.appendChild(s);return true}catch(e){return false}}
const t=setInterval(()=>{if(injectIntoDeep())clearInterval(t)},180);setTimeout(()=>clearInterval(t),15000);
</script></body></html>
